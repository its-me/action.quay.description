name: zizmor

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: its-me/action.zizmor@584452e9b255076750db37bedafd7db108da99bb # v1.0.2
